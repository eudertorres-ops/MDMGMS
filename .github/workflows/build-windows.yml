name: Build Windows Agent

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained single-file exe)
        shell: pwsh
        run: >
          dotnet publish windows/ControllerAgente.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Rename output
        shell: pwsh
        run: Copy-Item publish/ControllerAgenteNotebook.exe ControllerAgenteNotebook.exe -Force

      - name: Upload EXE (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: controller-agente-notebook
          path: ControllerAgenteNotebook.exe
          if-no-files-found: error

      - name: Publish EXE as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: Controller Agente Notebook (Windows)
          files: ControllerAgenteNotebook.exe
